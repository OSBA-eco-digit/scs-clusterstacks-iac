---
scs_cluster_stack_group: "{{ scs_cluster_stack_user }}"
scs_cluster_stack_helper: "{{scs_cluster_stack_helper_repo}}/releases/latest/download/openstack-csp-helper.tgz"
scs_cluster_stack_helper_repo: "https://github.com/SovereignCloudStack/openstack-csp-helper"
scs_cluster_stack_home: "/var/lib/{{ scs_cluster_stack_user }}"
scs_cluster_stack_operator_repo: "https://github.com/SovereignCloudStack/cluster-stack-operator"
scs_cluster_stack_operator_specs: "{{scs_cluster_stack_operator_repo}}/releases/latest/download/cso-infrastructure-components.yaml"
scs_cluster_stack_operator_specs_yaml: "{{scs_cluster_stack_home}}/scs-operator-specs.yaml"
scs_cluster_stack_provider_repo: "https://github.com/SovereignCloudStack/cluster-stack-provider-openstack"
scs_cluster_stack_provider_specs: "{{scs_cluster_stack_provider_repo}}/releases/latest/download/cspo-infrastructure-components.yaml"
scs_cluster_stack_provider_specs_yaml: "{{scs_cluster_stack_home}}/scs-provider-specs.yaml"
scs_cluster_stack_user: "scs"

#
# git/github
#

github_personal_token: "github_personal_token"
#  git-access-token: ${GIT_ACCESS_TOKEN_B64:=""}
#  git-org-name: ${GIT_ORG_NAME_B64:=""}
#  git-provider: ${GIT_PROVIDER_B64:=""}
#  git-repo-name: ${GIT_REPOSITORY_NAME_B64:=""}

#
# oci
#

#  oci-access-token: ${OCI_ACCESS_TOKEN_B64:=""}
#  oci-password: ${OCI_PASSWORD_B64:=""}
#  oci-registry: ${OCI_REGISTRY_B64:=""}
#  oci-repository: ${OCI_REPOSITORY_B64:=""}
#  oci-username: ${OCI_USERNAME_B64:=""}

#
# canonical
#

canonical_capi_repo: "https://github.com/canonical/cluster-api-k8s"
canonical_capi_version: "v0.4.2"

#
# docker
#

docker_apt_repo: "https://download.docker.com/linux/{{ansible_distribution|lower}}"
docker_apt_repo_filename: "docker"
docker_apt_repo_key: "https://download.docker.com/linux/{{ansible_distribution|lower}}/gpg"
docker_apt_sign_key: "/etc/apt/trusted.gpg.d/{{docker_apt_repo_filename}}.asc"
docker_gpg_key: "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
docker_gpg_keyserver: "https://keys.openpgp.org"

#
# openstack
#

openstack_application_credential_id: "{{ lookup('env', 'OS_APPLICATION_CREDENTIAL_ID') }}"
openstack_application_credential_secret: "{{ lookup('env', 'OS_APPLICATION_CREDENTIAL_SECRET') }}"
openstack_auth_url: "{{ lookup('env', 'OS_AUTH_URL') }}"
openstack_bastion_machine_flavor: "SCS-2V-4-20s"
openstack_cloud_name: "{{ lookup('env', 'OS_CLOUD') }}"
openstack_clouds_yaml: "{{scs_cluster_stack_home}}/.config/openstack/clouds.yaml"
openstack_controlplane_machine_flavor: "{{ openstack_bastion_machine_flavor }}"
openstack_dns_nameservers: "9.9.9.9, 8.8.8.8, 1.1.1.1"
openstack_external_network_id: "{{ lookup('env', 'OS_EXTERNAL_NETWORK_ID') }}"
openstack_image_name: "Ubuntu 24.04"
openstack_node_machine_flavor: "{{ openstack_bastion_machine_flavor }}"
openstack_orc_release: "v2.4.0"
openstack_orc_repo: "https://github.com/k-orc/openstack-resource-controller"
openstack_orc_yaml: "{{openstack_orc_repo}}/releases/download/{{openstack_orc_release}}/install.yaml"
openstack_secret_name: "{{ lookup('env', 'OS_SECRET') }}"
openstack_ssh_key_name: "mysshkey"
openstack_region_name: "{{ lookup('env', 'OS_REGION_NAME') }}"
openstack_interface: "{{ lookup('env', 'OS_INTERFACE') }}"

#
# kubernetes
#

k3s_bin: "/usr/local/bin/k3s"

kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"

kubernetes_release: "{{kubernetes_release_version}}.{{kubernetes_release_version_patch}}"
kubernetes_release_version: "1.34"
kubernetes_release_version_patch: "2"
kubernetes_service_host: "127.0.0.1"
kubernetes_service_port: 6443

clusterctl_bin: "/usr/local/bin/clusterctl"
clusterctl_bin_sha256: "cedcb3ec1694dcae19f57368b69c4b9edce48648b2795fe5867edff27bfee65e"
clusterctl_bin_url: "https://github.com/kubernetes-sigs/cluster-api/releases/download/v{{clusterctl_release}}/clusterctl-linux-amd64"
clusterctl_release: "1.12.1"

envsubst_bin: "/usr/local/bin/envsubst"
envsubst_helper: "/usr/local/bin/envsubst-helper.sh"
envsubst_release: "latest"

helm_bin: "/usr/local/bin/helm"
helm_bin_sha256: "c77e9e7c1cc96e066bd240d190d1beed9a6b08060b2043ef0862c4f865eca08f"
helm_bin_url: "https://get.helm.sh/helm-v{{helm_release}}-linux-amd64.tar.gz"
helm_release: "4.0.0"

kubectl_bin: "/usr/local/bin/kubectl"
kubectl_bin_sha256: "9591f3d75e1581f3f7392e6ad119aab2f28ae7d6c6e083dc5d22469667f27253"
kubectl_bin_url: "https://dl.k8s.io/release/v{{kubernetes_release}}/bin/linux/amd64/kubectl"

#
# cluster stack settings
#

cluster_api_version: "clusterstack.x-k8s.io/v1alpha1"
cluster_api_version_addons: "addons.cluster.x-k8s.io/v1beta1"

cluster_class: "openstack-{{cluster_name}}-{{kubernetes_release_version}}-{{cluster_series}}-{{cluster_version}}"

cluster_channel: "stable"
cluster_cidr_pods: "172.16.0.0/18"
cluster_cidr_services: "10.96.0.0/14"
cluster_ctrlnodes: 1
cluster_external_network_id: "{{ openstack_external_network_id }}"
cluster_name: "mycluster"
cluster_namespace: "mynamespace"
cluster_oci_repo_cso: "registry.scs.community/cluster-stacks/cso"
cluster_oci_repo_kaas: "registry.scs.community/kaas/cluster-stacks"
cluster_release: "{{kubernetes_release}}"
cluster_release_version: "{{kubernetes_release_version}}"
cluster_release_version_patch: "{{kubernetes_release_version_patch}}"
cluster_secret: "{{ openstack_secret_name }}"
cluster_series: "scs2"
cluster_variables: "apiserverloadbalancer: octavia-ovn"
cluster_version: "v1"
cluster_wrkrnodes: 1
