---
scs_cluster_stack_cmd: "{{ scs_cluster_stack_bin }} --conf: {{ scs_cluster_stack_conf }}"
scs_cluster_stack_conf: "{{ scs_cluster_stack_conf_dir }}/scs_cluster_stack.yaml"
scs_cluster_stack_conf_dir: "/etc/scs_cluster_stack"
scs_cluster_stack_group: "{{ scs_cluster_stack_user }}"
scs_cluster_stack_home: "/var/lib/scs_cluster_stack"
scs_cluster_stack_logfile: "/var/log/scs_cluster_stack.log"
scs_cluster_stack_logrotat_dir: "/etc/logrotate.d"
scs_cluster_stack_logrotate: "{{ scs_cluster_stack_logrotat_dir }}/scs_cluster_stack"
scs_cluster_stack_repo: "https://github.com/egypcio/scs-kaas-scripts"
scs_cluster_stack_repo_branch: "main-debian-fixes"
scs_cluster_stack_repo_commit: "ce630c0bdaee026307c10e8d4d52168318cc433c"
scs_cluster_stack_service: "scs_cluster_stack"
scs_cluster_stack_service_unit: "/etc/systemd/system/{{ scs_cluster_stack_service }}.service"
scs_cluster_stack_src_dir: "{{ scs_cluster_stack_home }}/src"
scs_cluster_stack_user: "scs_cluster_stack"
scs_cluster_stack_capi_k8s_repo: "https://github.com/canonical/cluster-api-k8s"
scs_cluster_stack_capi_k8s_tag: "v0.4.2"  # v0.5.0 is not marked as 'verified'

#
# openstack
#

openstack_bastion_machine_flavor: "SCS-2V-4-20s"
openstack_cloud_name: "{{ lookup('env', 'OS_CLOUD') }}"
openstack_controlplane_machine_flavor: "{{ openstack_bastion_machine_flavor }}"
openstack_dns_nameservers: "9.9.9.9, 8.8.8.8, 1.1.1.1"
openstack_external_network_id: "{{ lookup('env', 'OS_EXTERNAL_NETWORK_ID') }}"
openstack_image_name: "Ubuntu 24.04"
openstack_node_machine_flavor: "{{ openstack_bastion_machine_flavor }}"
openstack_ssh_key_name: "mysshkey"

#
# docker
#

docker_apt_repo: "https://download.docker.com/linux/{{ansible_distribution|lower}}"
docker_apt_repo_filename: "docker"
docker_apt_repo_key: "https://download.docker.com/linux/{{ansible_distribution|lower}}/gpg"
docker_apt_sign_key: "/etc/apt/trusted.gpg.d/{{docker_apt_repo_filename}}.asc"
docker_gpg_key: "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
docker_gpg_keyserver: "https://keys.openpgp.org"

#
# cluster stack components
#

clusterctl_release: "1.12.0"   # clusterctl
helm_release: "4.0.0"          # helm
kubernetes_service_host: "127.0.0.1"
kubernetes_service_port: 6443
kubernetes_release: "{{kubernetes_release_version}}.{{kubernetes_release_version_patch}}"   # kubectl
kubernetes_release_version: "1.34"
kubernetes_release_version_patch: "2"

korc_yaml_url: "https://github.com/k-orc/openstack-resource-controller/releases/latest/download/install.yaml"

clusterctl_bin_url: "https://github.com/kubernetes-sigs/cluster-api/releases/download/v{{clusterctl_release}}/clusterctl-linux-amd64"
helm_bin_url: "https://get.helm.sh/helm-v{{helm_release}}-linux-amd64.tar.gz"
kubectl_bin_url: "https://dl.k8s.io/release/v{{kubernetes_release}}/bin/linux/amd64/kubectl"

clusterctl_bin: "/usr/local/bin/clusterctl"
helm_bin: "/usr/local/bin/helm"
kubectl_bin: "/usr/local/bin/kubectl"

clusterctl_bin_sha256: "9b432d6ce52c8186cc002b15e906c09e74afa445d0766ee67bd25753fba33ce6"
helm_bin_sha256: "c77e9e7c1cc96e066bd240d190d1beed9a6b08060b2043ef0862c4f865eca08f"
kubectl_bin_sha256: "9591f3d75e1581f3f7392e6ad119aab2f28ae7d6c6e083dc5d22469667f27253"

#
# settings
#

cluster_api_version: "clusterstack.x-k8s.io/v1alpha1"
cluster_api_version_addons: "addons.cluster.x-k8s.io/v1beta1"

cluster_cidr_pods: "172.16.0.0/18"
cluster_cidr_services: "10.96.0.0/14"
cluster_clouds_yaml: "{{scs_cluster_stack_home}}/.config/openstack/clouds.yaml"
cluster_ctrlnodes: 1
cluster_name: "mycluster"
cluster_namespace: "mynamespace"
cluster_oci_repo_cso: "registry.scs.community/cluster-stacks/cso"
cluster_oci_repo_kaas: "registry.scs.community/kaas/cluster-stacks"
cluster_os_cloud: "openstack"
cluster_release: "{{kubernetes_release}}"
cluster_release_version: "{{kubernetes_release_version}}"
cluster_series: "scs2"
cluster_variables: "apiserverloadbalancer: octavia-ovn"
cluster_version: [v1]
cluster_wrkrnodes: 1
