---
certmanager_release: "1.19.2"

clusterctl_bin: "/usr/local/bin/clusterctl"
clusterctl_bin_sha256: "c9f05fb8a7839067bcfb2c897f4b7cab37b7c2780aef12669b5fd89a1dd6dffd"
clusterctl_bin_url: "https://github.com/kubernetes-sigs/cluster-api/releases/download/v{{clusterctl_release}}/clusterctl-linux-amd64"
clusterctl_release: "1.12.2"

cs_role_config_system: true
cs_role_mgmt_cluster: "kind"
cs_role_scripts_only: false

cs_api_contract: "v1beta1"
cs_api_contract_addons: "{{ cs_api_contract }}"
cs_api_contract_clusterstack: "v1alpha1"
cs_api_contract_clusterstack_addons: "{{ cs_api_contract_clusterstack }}"
cs_api_contract_clusterstack_csctl: "{{ cs_api_contract_clusterstack }}"
cs_api_contract_clusterstack_infrastructure: "{{ cs_api_contract_clusterstack }}"
cs_cidr_managed_subnets: "10.96.0.0/24"
cs_cidr_pods: "172.16.0.0/16"
cs_cidr_services: "10.96.0.0/12"
cs_cluster_class: "openstack-{{cs_series}}-{{kubernetes_release_major}}-{{cs_series_version}}"
cs_cluster_name: "mycluster"
cs_cluster_namespace: "mynamespace"
cs_control_plane_replicas: 1
cs_external_network_id: "{{ os_external_network_id }}"
cs_repo_cso: "oci://registry.scs.community/cluster-stacks/cso"
cs_series: "scs2"
cs_series_channel: "stable"
cs_series_version: "v1"
cs_services_domain: "mydomain.local"
cs_user_group: "{{ cs_user_name }}"
cs_user_home: "/var/lib/{{ cs_user_name }}"
cs_user_name: "scs2"
cs_workers_replicas: 1

cs_image_url: "https://nbg1.your-objectstorage.com/osism/openstack-k8s-capi-images/ubuntu-2404-kube-v1.34/ubuntu-2404-kube-v1.34.3.qcow2"
cs_image_sha256: "f3dda104391733ee50e97995be2a2dc1004a2ecb4abe250d11dbdd584af554fa"

docker_apt_repo: "https://download.docker.com/linux/{{ansible_distribution|lower}}"
docker_apt_repo_filename: "docker"
docker_apt_repo_key: "https://download.docker.com/linux/{{ansible_distribution|lower}}/gpg"
docker_apt_sign_key: "/etc/apt/trusted.gpg.d/{{docker_apt_repo_filename}}.asc"
docker_daemon_mtu: 1280
docker_gpg_key: "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
docker_gpg_keyserver: "https://keys.openpgp.org"

helm_bin: "/usr/local/bin/helm"
helm_bin_sha256: "8e7ae5cb890c56f53713bffec38e41cd8e7e4619ebe56f8b31cd383bfb3dbb83"
helm_bin_url: "https://get.helm.sh/helm-v{{helm_release}}-linux-amd64.tar.gz"
helm_release: "4.1.0"

k3s_bin: "/usr/local/bin/k3s"
k3s_capi_release: "0.1.9"
k3s_cloud_config_b64: ""
k3s_release: "v1.34.3+k3s1"

kind_bin: "/usr/local/bin/kind"
kind_bin_sha256: "eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa"
kind_release: "0.31.0"

kubeconfig_b64: ""
kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
kubectl_bin: "/usr/local/bin/kubectl"
kubectl_bin_sha256: "ab60ca5f0fd60c1eb81b52909e67060e3ba0bd27e55a8ac147cbc2172ff14212"
kubectl_bin_url: "https://dl.k8s.io/release/v{{kubernetes_release}}/bin/linux/amd64/kubectl"
kubectl_release: "{{kubernetes_release}}"
kubernetes_release: "{{kubernetes_release_major}}.{{kubernetes_release_patch}}"
kubernetes_release_major: "1.34"
kubernetes_release_patch: "3"

orc_release: "2.4.0"
orc_repo: "https://github.com/k-orc/openstack-resource-controller"
orc_yaml: "{{orc_repo}}/releases/download/v{{orc_release}}/install.yaml"

os_application_credential_id: "{{ lookup('env', 'OS_APPLICATION_CREDENTIAL_ID') }}"
os_application_credential_secret: "{{ lookup('env', 'OS_APPLICATION_CREDENTIAL_SECRET') }}"
os_auth_url: "{{ lookup('env', 'OS_AUTH_URL') }}"
os_auth_type: "v3applicationcredential"
os_cloud: "{{ lookup('env', 'OS_CLOUD') }}"
os_cloud_cacert_b64: ""
os_cloud_config_path: "{{cs_user_home}}/.config/openstack/cloud.conf"
os_cloud_yaml_b64: ""
os_cloud_yaml: "{{cs_user_home}}/.config/openstack/clouds.yaml"
os_clouds_yaml: "{{os_cloud_yaml}}"
os_control_plane_machine_flavor: "{{ os_node_machine_flavor }}"
os_control_plane_machine_image: "{{ os_image_name }}"
os_dns_nameservers: "9.9.9.9, 8.8.8.8, 1.1.1.1"
os_domain_name: "{{lookup('env', 'OS_DOMAIN_NAME') }}"
os_external_network_id: "{{ lookup('env', 'OS_EXTERNAL_NETWORK_ID') }}"
os_failure_domain: "{{lookup('env', 'OS_FAILURE_DOMAIN') }}"
os_identity_api_version: "3"
os_image_name: "Ubuntu 24.04"
os_interface: "{{ lookup('env', 'OS_INTERFACE') }}"
os_node_machine_flavor: "SCS-2V-4-20s"
os_node_machine_image: "{{os_image_name}}"
os_provider_release: "0.14.0"
os_region_name: "{{ lookup('env', 'OS_REGION_NAME') }}"
os_ssh_key_name: "mysshkey"
os_tenant_id: "{{ lookup('env', 'OS_TENANT_ID') }}"
os_worker_machine_flavor: "{{ os_node_machine_flavor }}"
os_worker_machine_image: "{{ os_image_name }}"
os_worker_machine_root_disk_size: 32
