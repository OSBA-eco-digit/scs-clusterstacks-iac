---
- name: Setup apt-key, when older than Debian bullseye
  get_url:
    keyserver: "{{ docker_gpg_keyserver }}"
    id: "{{ docker_gpg_key }}"
    state: present
  when: "ansible_distribution_major_version|int < 11"

- name: Setup apt-key, when Debian bullseye or above
  become: true
  get_url:
    url: "{{ docker_apt_repo_key }}"
    dest: "{{ docker_apt_sign_key }}"
    mode: '0444'
  when: "ansible_distribution_major_version|int >= 11"

- name: Configure apt repository
  become: true
  apt_repository:
    repo: "deb [arch=amd64 signed-by={{docker_apt_sign_key}}] {{docker_apt_repo}} {{ansible_lsb.codename}} stable"
    filename: "{{ docker_apt_repo_filename }}"

- name: Install packages
  become: true
  apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present
