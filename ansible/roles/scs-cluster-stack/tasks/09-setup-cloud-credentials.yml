---
- name: Template "k3s-cloud.conf"
  become: true
  template:
    src: k3s-cloud.conf.j2
    dest: "{{scs_cs_user_home}}/k3s-cloud.conf"
    mode: 0440

- name: Encode "k3s-cloud.conf"
  set_fact:
    k3s_cloud_conf_b64: "{{ lookup('file', {{scs_cs_user_home}}/k3s-cloud.conf) | b64encode }}"

- name: Template "k3s-cloud-config.yaml"
  become: true
  template:
    src: k3s-cloud-config.yaml.j2
    dest: "{{scs_cs_user_home}}/k3s-cloud-config.yaml"
    mode: 0440

- name: Apply "k3s-cloud-config.yaml"
  become: true
  command: "{{ k3s_bin }} kubectl apply -f {{scs_cs_user_home}}/k3s-cloud-config.yaml"
