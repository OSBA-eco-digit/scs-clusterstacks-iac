---
- name: Check if "clusterctl" exists
  stat:
    path: "{{ clusterctl_bin }}"
  register: check_clusterctl

- name: Get "clusterctl"
  become: true
  get_url:
    url: "{{ clusterctl_bin_url }}"
    dest: "{{ clusterctl_bin }}"
    checksum: "sha256:{{clusterctl_bin_sha256}}"
    mode: 0755
  when: not check_clusterctl.stat.exists
  register: get_clusterctl

- name: Strip "clusterctl"
  become: true
  command: "strip {{ clusterctl_bin }}"
  when: get_clusterctl.changed

- name: Generate bash completions for "clusterctl"
  become: true
  command: "{{ clusterctl_bin }} completion bash"
  register: completions_clusterctl
  args:
    creates: "/etc/bash_completion.d/clusterctl"

- name: Copy completions for "clusterctl" to a file
  become: true
  copy:
    content: "{{ completions_clusterctl.stdout }}"
    dest:  "/etc/bash_completion.d/clusterctl"
    mode: 0444
  when: completions_clusterctl.changed

- name: Get "helm"
  become: true
  unarchive:
    dest: "/usr/local/bin/"
    include:
      - linux-amd64/helm
    extra_opts: "--strip-components=1"
    mode: 0755
    remote_src: true
    src: "{{ helm_bin_url }}"
  args:
    creates: "{{ helm_bin }}"
  register: get_helm

- name: Generate bash completions for "kubectl"
  become: true
  command: "{{ kubectl_bin }} completion bash"
  register: completions_kubectl
  args:
    creates: "/etc/bash_completion.d/kubectl"

- name: Copy completions for "kubectl" to a file
  become: true
  copy:
    content: "{{ completions_kubectl.stdout }}"
    dest:  "/etc/bash_completion.d/kubectl"
    mode: 0444
  when: completions_kubectl.changed

