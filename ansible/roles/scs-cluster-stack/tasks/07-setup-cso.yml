---
- name: Template "clouds.yaml"
  become: true
  template:
    src: openstack-clouds.yaml.j2
    dest: "{{openstack_clouds_yaml}}"
    mode: 0444

- name: Template "envsubst-helper.sh"
  become: true
  template:
    src: envsubst-helper.sh.j2
    dest: "{{ envsubst_helper }}"
    mode: 0444

- name: Generate generic secret for OpenStack from "clouds.yaml"
  become: true
  command:
    cmd: "{{k3s_bin}} kubectl create secret generic openstack -n {{cluster_namespace}} --from-file=clouds.yaml={{openstack_clouds_yaml}} --dry-run=client -o yaml"
  register: secrets_openstack_generic

- name: Copy generated secret to a file
  become: true
  copy:
    content: "{{ secrets_openstack_generic.stdout }}"
    dest:  "{{scs_cluster_stack_home}}/.secret"
    mode: 0444
  when: secrets_openstack_generic.changed

- name: Apply generated secret
  become: true
  command:
    cmd: "{{k3s_bin}} kubectl apply -f {{scs_cluster_stack_home}}/.secret"

- name: Check if "{{scs_cluster_stack_operator_specs_yaml}}" exists
  become: true
  stat:
    path: "{{ scs_cluster_stack_operator_specs_yaml }}"
  register: check_scs_cluster_stack_operator_specs_yaml

- name: Get "{{scs_cluster_stack_operator_specs_yaml}}"
  become: true
  get_url:
    url: "{{ scs_cluster_stack_operator_specs }}"
    dest: "{{ scs_cluster_stack_operator_specs_yaml }}"
    mode: 0640
  when: not check_scs_cluster_stack_operator_specs_yaml.stat.exists
  register: get_scs_cluster_stack_operator_specs_yaml

- name: envsubst "{{scs_cluster_stack_operator_specs_yaml}}" using "envsubst-helper.sh"
  become: true
  command: /bin/sh {{ envsubst_helper }} {{ scs_cluster_stack_operator_specs_yaml }} {{ scs_cluster_stack_operator_specs_yaml }}.envsubst
  when: get_scs_cluster_stack_operator_specs_yaml.changed

- name: Apply operator specs for SCS
  become: true
  command: "{{ k3s_bin }} kubectl apply -f {{ scs_cluster_stack_operator_specs_yaml }}.envsubst"
