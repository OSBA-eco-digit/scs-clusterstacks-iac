---
- name: Template the Cluster Stack YAML
  template:
    src: scs-cso.yaml.j2
    dest: "{{scs_cluster_stack_home}}/scs-cso.yaml"
    mode: 0444

- name: Install the Cluster Stack Operator via Helm
  command:
    argv:
      - helm
      - upgrade
      - --create-namespace
      - --set octavia_ovn=true
      - --values {{scs_cluster_stack_home}}/scs-cso.yaml
      - -i cso
      - -n {{ cluster_namespace }}
      - oci://{{ cluster_oci_repo_cso }}

- name: Rollout Cluster Stack Operator
  command:
    cmd: kubectl -n {{ cluster_namespace }} rollout status deployment
