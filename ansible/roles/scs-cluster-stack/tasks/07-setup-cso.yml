---
- name: Template the Cluster Stack YAML
  template:
    src: scs-cso.yaml.j2
    dest: "{{scs_cluster_stack_home}}/scs-cso.yaml"
    mode: 0444

- name: Helm the Operator itself
  command:
    argv:
      - helm
      - upgrade
      - --create-namespace
      - --set octavia_ovn=true
      - --values {{scs_cluster_stack_home}}/scs-cso.yaml
      - -i cso
      - -n cso-system
      - oci://registry.scs.community/cluster-stacks/cso
  ignore_errors: true
  no_log: true

- name: Rollout Cluster Stack Operator
  command:
    cmd: kubectl -n cso-system rollout status deployment
