---
- name: Template the Cluster Stack YAML to Deploy the CSO
  template:
    src: scs-cso.yaml.j2
    dest: "{{scs_cluster_stack_home}}/scs-cso.yaml"
    mode: 0444

- name: Check if we have the Cluster Stack Operator deployed already
  command:
    cmd: helm status -n {{ cluster_namespace }} cso
  register: helm_status_cso
  ignore_errors: true
  no_log: true

- name: Install the Cluster Stack Operator via Helm
  command:
    argv:
      - helm
      - upgrade
      - --create-namespace
      - --set octavia_ovn=true
      - --values {{scs_cluster_stack_home}}/scs-cso.yaml
      - -i cso
      - -n {{ cluster_namespace }}
      - oci://{{ cluster_oci_repo_cso }}
  ignore_errors: true
  no_log: true
  when: helm_status_cso is failed

- name: Rollout Cluster Stack Operator
  command:
    cmd: kubectl -n {{ cluster_namespace }} rollout status deployment
