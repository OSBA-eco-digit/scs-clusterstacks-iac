- name: Template "specs-clusterstack.yaml"
  become: true
  template:
    src: specs-clusterstack.yaml.j2
    dest: "{{cs_user_home}}/specs-clusterstack.yaml"

- name: Template "specs-workloadcluster.yaml"
  become: true
  template:
    src: specs-workloadcluster.yaml.j2
    dest: "{{cs_user_home}}/specs-workloadcluster.yaml"
