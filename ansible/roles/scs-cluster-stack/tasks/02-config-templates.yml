- name: Template "image-openstack-scs2.yaml"
  become: true
  template:
    src: image-openstack-scs2.yaml.j2
    dest: "{{cs_user_home}}/image-openstack-scs2.yaml"
######################################################################

#
# SPECIFICATIONS
#

- name: Template "specs-namespace.yaml"
  become: true
  template:
