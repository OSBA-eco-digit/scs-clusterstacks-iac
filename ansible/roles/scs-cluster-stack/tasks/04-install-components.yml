---
- name: Get "clusterctl"
  get_url:
    url: "{{ clusterctl_bin_url }}"
    dest: "{{ clusterctl_bin }}"
    checksum: "sha256:{{clusterctl_bin_sha256}}"
    mode: 0755

- name: Get and Decompress "helm"
  unarchive:
    dest: "/usr/local/bin/"
    include:
      - linux-amd64/helm
    extra_opts: "--strip-components=1"
    mode: 0755
    remote_src: true
    src: "{{ helm_bin_url }}"
  args:
    creates: "{{ helm_bin }}"

- name: Get "kind"
  get_url:
    url: "{{ kind_bin_url }}"
    dest: "{{ kind_bin }}"
    checksum: "sha256:{{kind_bin_sha256}}"
    mode: 0755

- name: Get "kubectl"
  get_url:
    url: "{{ kubectl_bin_url }}"
    dest: "{{ kubectl_bin }}"
    checksum: "sha256:{{kubectl_bin_sha256}}"
    mode: 0755

- name: Strip binaries from installed components
  command:
    cmd: "strip /usr/local/bin/{{ bin }}"
  loop:
    - clusterctl
    - kind
    - kubectl
  loop_control:
    loop_var: bin
