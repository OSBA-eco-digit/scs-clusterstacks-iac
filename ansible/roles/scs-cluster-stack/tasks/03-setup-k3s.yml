# ---
# - name: Install K3s if not already installed
#   shell: |
#     curl -sfL https://get.k3s.io | sh -
#   args:
#     creates: /usr/local/bin/k3s
#   
# - name: Check K3s service status
#   systemd:
#     name: k3s
#     state: started
#     enabled: true

---
- name: Apply 'k3s' role
  include_role:
    name: k3s
  vars:
    k3s_agent:
      node-label:
        - "cluster-api=true"
        - "cluster-stack=true"
        - "control-plane=true"
        - "worker=true"
        - "workload=true"
  when: k3s_apply_role
