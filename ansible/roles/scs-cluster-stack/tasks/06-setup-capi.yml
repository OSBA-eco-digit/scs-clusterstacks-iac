---
# https://documentation.ubuntu.com/canonical-kubernetes/latest/capi/howto/provision/
- name: Clone "{{ scs_cluster_stack_capi_k8s_repo }}" git repository
  git:
    repo: "{{ scs_cluster_stack_capi_k8s_repo }}"
    dest: "{{ scs_cluster_stack_home }}/capi-k8s"
    single_branch: true
    version: "{{ scs_cluster_stack_capi_k8s_tag }}"
    clone: true
    update: false
  environment:
    GIT_TERMINAL_PROMPT: 0
  when: ansible_facts.distribution == 'Ubuntu'

- name: Template the "capi-k8s-vars.rc" env. variables files
  template:
    src: capi-k8s-vars.rc.j2
    dest: "{{scs_cluster_stack_home}}/capi-k8s-vars.rc"
    mode: 0444

- name: Apply k-ORC as dependency used by "clusterctl"
  command:
    cmd: "kubectl apply -f {{ korc_yaml_url }}"
  environment:
    CLUSTER_TOPOLOGY=true
    EXP_CLUSTER_RESOURCE_SET=true
    EXP_RUNTIME_SDK=true

# - name: Create the "{{ cluster_namespace }}" namespace
#   command:
#     cmd: "kubectl create namespace {{ cluster_namespace }} || true"
#   no_log: true
#   ignore_errors: true

- name: Initialize the cluster
  command:
    cmd: "clusterctl init -b canonical-kubernetes -c canonical-kubernetes -i openstack -n {{ cluster_namespace }}"
  environment:
    CLUSTER_TOPOLOGY=true
    EXP_CLUSTER_RESOURCE_SET=true
    EXP_RUNTIME_SDK=true
  ignore_errors: true
  no_log: true
