---
- name: Template "{{scs_cluster_stack_home}}/capi-k8s-specs.yaml"
  become: true
  template:
    src: capi-k8s-specs.yaml.j2
    dest: "{{scs_cluster_stack_home}}/capi-k8s-specs.yaml"
    mode: 0440

- name: Template "{{scs_cluster_stack_home}}/capi-k8s-vars.rc"
  become: true
  template:
    src: capi-k8s-vars.rc.j2
    dest: "{{scs_cluster_stack_home}}/capi-k8s-vars.rc"
    mode: 0440

- name: Initialize cluster
  become: true
  shell:
    cmd: |
      source {{scs_cluster_stack_home}}/capi-k8s-vars.rc \
      && CLUSTER_TOPOLOGY=true KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
         clusterctl init -b canonical-kubernetes -c canonical-kubernetes -i openstack
  environment:
    CLUSTER_TOPOLOGY=true
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml
  args:
    executable: /bin/bash

- name: Generate cluster configuration from template
  become: true
  shell:
    cmd: |
      source {{scs_cluster_stack_home}}/capi-k8s-vars.rc \
      && clusterctl generate cluster {{ cluster_name }} --kubernetes-version v{{kubernetes_release}} -f {{scs_cluster_stack_home}}/capi-k8s-specs.yaml \
      > {{scs_cluster_stack_home}}/cluster_{{cluster_name}}.yaml
  environment:
    CLUSTER_TOPOLOGY=true
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml
