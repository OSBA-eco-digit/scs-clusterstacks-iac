---
- name: Apply k-ORC as dependency used by "clusterctl" to rollout CAPI/CAPO
  command:
    cmd: >
      kubectl apply -f "{{korc_yaml_url}}"
  environment:
    CLUSTER_TOPOLOGY=true
    EXP_CLUSTER_RESOURCE_SET=true
    EXP_RUNTIME_SDK=true

- name: Rollout CAPI/CAPO
  command:
    cmd: "clusterctl init -n {{ cluster_namespace }} --infrastructure=openstack"
  environment:
    CLUSTER_TOPOLOGY=true
    EXP_CLUSTER_RESOURCE_SET=true
    EXP_RUNTIME_SDK=true
  ignore_errors: true
