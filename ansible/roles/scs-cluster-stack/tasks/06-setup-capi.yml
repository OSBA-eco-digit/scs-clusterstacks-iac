---
- name: Apply k-ORC as dependency
  command:
    cmd: >
      kubectl apply -f "{{korc_yaml_url}}"
  environment:
    CLUSTER_TOPOLOGY=true
    EXP_CLUSTER_RESOURCE_SET=true
    EXP_RUNTIME_SDK=true

- name: Rollout CAPI/CAPO
  command:
    cmd:
     - clusterctl init --infrastructure openstack || true
     - kubectl -n capi-system rollout status deployment || true
     - kubectl -n capo-system rollout status deployment || true
  environment:
    CLUSTER_TOPOLOGY=true
    EXP_CLUSTER_RESOURCE_SET=true
    EXP_RUNTIME_SDK=true
  ignore_errors: true
